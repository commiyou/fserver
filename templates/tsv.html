<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>表格 {{name}}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.7.1/dist/css/tabulator.min.css">
    <style>
    :root {
      --page-gutter: 20px;
      --border: #d9dee4;
      --text: #24292f;
      --muted: #667085;
      --accent: #1a56a0;
    }

    html,
    body {
      max-width: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #f5f6f8;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      width: 100%;
      max-width: 100%;
      padding: 12px var(--page-gutter) 24px;
      box-sizing: border-box;
    }

    .page-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid var(--border);
      border-radius: 7px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(8px);
    }

    .heading {
      display: flex;
      flex: 1 1 360px;
      align-items: center;
      min-width: 0;
      gap: 10px;
    }

    .heading-icon {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 18px;
    }

    .heading-main {
      min-width: 0;
    }

    .heading-title {
      overflow: hidden;
      margin: 0;
      font-size: 19px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .heading-meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 6px 10px;
      color: var(--text);
      background: #fff;
      border: 1px solid #c8ced6;
      border-radius: 5px;
      box-sizing: border-box;
      text-decoration: none;
      cursor: pointer;
    }

    .button:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .button.primary {
      color: #fff;
      background: #1f7a4f;
      border-color: #176640;
    }

    .button.primary:hover {
      color: #fff;
      background: #176640;
    }

    .alert {
      padding: 10px 12px;
      margin-bottom: 10px;
      color: #6b4e00;
      background: #fff8db;
      border: 1px solid #f0d36d;
      border-radius: 6px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
      padding: 9px 12px;
      margin-bottom: 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 7px;
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .toolbar label {
      color: var(--muted);
      font-weight: 600;
    }

    .control {
      height: 30px;
      padding: 4px 8px;
      color: var(--text);
      background: #fff;
      border: 1px solid #c8ced6;
      border-radius: 4px;
      box-sizing: border-box;
    }

    #key {
      max-width: 150px;
    }

    #value {
      width: min(220px, 32vw);
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 6px;
      color: var(--muted);
      font-size: 12px;
    }

    #tsv-table {
      width: 100%;
      min-height: 320px;
      border: 1px solid var(--border);
      border-radius: 7px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
    }

    .tabulator {
      background: #fff;
      border: 0;
      font-size: 13px;
    }

    .tabulator .tabulator-header {
      color: #344054;
      background: #f8f9fa;
      border-bottom: 1px solid #cfd5dc;
    }

    .tabulator .tabulator-header .tabulator-col {
      background: #f8f9fa;
    }

    .tabulator .tabulator-header .tabulator-col.tabulator-frozen {
      background: #f1f5f9;
    }

    .tabulator .tabulator-row:hover {
      background: #f4f8ff;
    }

    .tabulator .tabulator-cell {
      padding: 7px 8px;
    }

    .json-cell summary {
      color: var(--accent);
      cursor: pointer;
      user-select: none;
    }

    .json-cell pre {
      max-width: 480px;
      max-height: 220px;
      margin: 6px 0 0;
      padding: 8px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      background: #f6f8fa;
      border: 1px solid #d8dee4;
      border-radius: 4px;
    }

    .image-cell img {
      display: block;
      width: auto;
      height: 88px;
      max-width: 180px;
      object-fit: contain;
    }

    .column-picker {
      position: fixed;
      top: 64px;
      right: var(--page-gutter);
      z-index: 200;
      display: none;
      width: min(300px, calc(100vw - 32px));
      max-height: min(65vh, 520px);
      overflow: auto;
      background: #fff;
      border: 1px solid #c8ced6;
      border-radius: 7px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
    }

    .column-picker.open {
      display: block;
    }

    .column-picker-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      background: #f8f9fa;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    .column-picker-list {
      padding: 6px 10px 10px;
    }

    .column-picker label {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 2px;
      cursor: pointer;
    }

    .column-picker input {
      margin: 0;
    }

    @media (max-width: 767px) {
      :root {
        --page-gutter: 8px;
      }

      .page {
        padding-top: 8px;
      }

      .page-header {
        align-items: flex-start;
        gap: 8px;
        padding: 8px;
      }

      .heading-title {
        font-size: 17px;
      }

      .heading-meta,
      .button-label {
        display: none;
      }

      .button {
        padding: 6px 8px;
      }

      .toolbar {
        align-items: stretch;
        padding: 8px;
      }

      .toolbar-group {
        width: 100%;
      }

      #key {
        max-width: 120px;
      }

      #value {
        flex: 1 1 150px;
      }

      #tsv-table {
        min-height: 260px;
      }

      .column-picker {
        top: 58px;
      }
    }
    </style>
  </head>
  <body>
    <main class="page">
      {% if warning_msg %}
      <div class="alert">
        <strong>文件格式警告：</strong>{{ warning_msg }}
      </div>
      {% endif %}

      <header class="page-header">
        <div class="heading">
          <span class="heading-icon">▦</span>
          <div class="heading-main">
            <h1 class="heading-title" title="{{name}}">{{name}}</h1>
            <div class="heading-meta">
              共 {{recordsTotal}} 条，本次加载 {{ length if length > 0 else '全部' }} 条 · Tabulator
            </div>
          </div>
        </div>
        <div class="actions">
          <a class="button" href="/list/{{parent_path}}" title="打开所在文件夹">
            <span>📁</span><span class="button-label">打开文件夹</span>
          </a>
          <button class="button copy-path-button" type="button" data-copy-path="{{ copy_path }}" title="{{ copy_path }}">
            <span>⧉</span><span class="button-label">复制路径</span>
          </button>
          <a class="button" href="?{{ request.url.query }}&reload=true" title="从磁盘重新加载">
            <span>↻</span>
          </a>
          <button class="button" type="button" id="column-picker-button" title="选择显示列">
            <span>☷</span><span class="button-label">列显示</span>
          </button>
          <a class="button primary" href="/excel/{{path}}?{{ request.url.query }}" target="_blank" title="导出 Excel">
            <span>⇩</span><span class="button-label">导出 Excel</span>
          </a>
        </div>
      </header>

      <section class="toolbar">
        <div class="toolbar-group">
          <label for="search">全文检索</label>
          <input class="control" type="search" id="search" placeholder="过滤当前加载的数据…">
        </div>
        <div class="toolbar-group">
          <label for="key">筛选列</label>
          <select class="control" id="key">
            <option value="">全部</option>
            {% for column in columns %}
            <option value="{{column}}">{{column}}</option>
            {% endfor %}
          </select>
          <input class="control" list="key-values" id="value" placeholder="输入或选择值…">
          <datalist id="key-values"></datalist>
        </div>
        <div class="toolbar-group">
          <label for="load-length">加载条数</label>
          <select class="control" id="load-length">
            <option value="500" selected>500</option>
            <option value="1000">1,000</option>
            <option value="5000">5,000</option>
            <option value="10000">10,000</option>
            <option value="-1">全部</option>
          </select>
          <button class="button" type="button" id="apply-key-filter">应用</button>
          <button class="button" type="button" id="reset-layout" title="清除保存的列宽、列可见性和排序">重置布局</button>
        </div>
      </section>

      <div class="status-bar">
        <span id="table-status">正在加载…</span>
        <span>拖动表头边缘调整列宽；宽表在网格内部横向滚动。</span>
      </div>

      <div class="column-picker" id="column-picker">
        <div class="column-picker-head">
          <span>显示列</span>
          <button class="button" type="button" id="column-picker-close">关闭</button>
        </div>
        <div class="column-picker-list" id="column-picker-list"></div>
      </div>

      <div id="tsv-table"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.7.1/dist/js/tabulator.min.js"></script>
    <script>
    (function() {
      "use strict";

      var rawColumns = {{ columns | tojson }};
      var jsonColumns = {{ json_cols | tojson }};
      var jsonLinkColumns = {{ json_link_cols | tojson }};
      var imageColumns = {{ image_cols | tojson }};
      var hiddenColumns = {{ hide_cols | tojson }};
      var extraParams = "{{ extra_params | safe }}";
      var start = {{ start if start is not none else 0 }};
      var requestedLength = {{ length if length is not none else 1000 }};
      var currentPageQuery = new URLSearchParams(window.location.search);
      document.getElementById("key").value = currentPageQuery.get("key") || "";
      document.getElementById("value").value = currentPageQuery.get("value") || "";
      var lengthSelect = document.getElementById("load-length");
      if (Array.from(lengthSelect.options).some(function(option) {
        return option.value === String(requestedLength);
      })) {
        lengthSelect.value = String(requestedLength);
      }

      function selectedLoadLength() {
        var selected = parseInt(document.getElementById("load-length").value, 10);
        return Number.isFinite(selected) ? selected : 1000;
      }

      function apiUrl() {
        var params = new URLSearchParams(currentPageQuery.toString());
        params.set("start", String(start));
        params.set("length", String(selectedLoadLength()));
        var extra = new URLSearchParams(extraParams.replace(/^&/, ""));
        extra.forEach(function(value, key) { params.set(key, value); });
        return "/api/tsv/{{path}}?" + params.toString();
      }

      function jsonCellFormatter(cell) {
        var value = cell.getValue();
        if (value === null || value === undefined || value === "") {
          return "";
        }
        var details = document.createElement("details");
        details.className = "json-cell";
        var summary = document.createElement("summary");
        summary.textContent = "展开 JSON";
        var pre = document.createElement("pre");
        try {
          var parsed = typeof value === "string" ? JSON.parse(value) : value;
          pre.textContent = JSON.stringify(parsed, null, 2);
        } catch (_error) {
          pre.textContent = String(value);
        }
        details.appendChild(summary);
        details.appendChild(pre);
        return details;
      }

      function jsonLinkFormatter(cell) {
        var value = cell.getValue();
        if (value === null || value === undefined || value === "") {
          return "";
        }
        var link = document.createElement("a");
        link.href = "/json_viewer?content=" + encodeURIComponent(value);
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "打开 JSON";
        return link;
      }

      function imageFormatter(cell) {
        var value = cell.getValue();
        if (!value) {
          return "";
        }
        var wrapper = document.createElement("div");
        wrapper.className = "image-cell";
        var image = document.createElement("img");
        image.src = value;
        image.alt = "";
        image.loading = "lazy";
        wrapper.appendChild(image);
        return wrapper;
      }

      var columns = rawColumns.map(function(name, index) {
        var definition = {
          title: name,
          field: name,
          resizable: true,
          minWidth: 88,
          maxWidth: 800,
          widthGrow: 1,
          visible: hiddenColumns.indexOf(index) === -1,
          frozen: index === 0,
          headerTooltip: name
        };
        if (jsonLinkColumns.indexOf(index) !== -1) {
          definition.formatter = jsonLinkFormatter;
          definition.minWidth = 120;
        } else if (jsonColumns.indexOf(index) !== -1) {
          definition.formatter = jsonCellFormatter;
          definition.minWidth = 260;
          definition.variableHeight = true;
        } else if (imageColumns.indexOf(index) !== -1) {
          definition.formatter = imageFormatter;
          definition.minWidth = 120;
          definition.variableHeight = true;
        }
        return definition;
      });

      var persistenceID = "fserver.tsv:" + window.location.pathname + ":" +
        rawColumns.join("|").split("").reduce(function(hash, char) {
          return ((hash << 5) - hash + char.charCodeAt(0)) | 0;
        }, 0);

      var table = new Tabulator("#tsv-table", {
        maxHeight: "calc(100vh - 250px)",
        minHeight: 320,
        columns: columns,
        ajaxURL: apiUrl(),
        ajaxResponse: function(_url, _params, response) {
          return response.data || [];
        },
        layout: "fitDataStretch",
        pagination: true,
        paginationSize: 20,
        paginationSizeSelector: [20, 100, 500, true],
        locale: "zh-cn",
        langs: {
          "zh-cn": {
            data: {
              loading: "正在加载",
              error: "加载失败"
            },
            pagination: {
              page_size: "每页",
              page_title: "页码",
              first: "首页",
              first_title: "第一页",
              last: "尾页",
              last_title: "最后一页",
              prev: "上一页",
              prev_title: "上一页",
              next: "下一页",
              next_title: "下一页",
              all: "全部",
              counter: {
                showing: "显示",
                of: "共",
                rows: "行",
                pages: "页"
              }
            }
          }
        },
        movableColumns: false,
        resizableColumnFit: false,
        responsiveLayout: false,
        persistence: true,
        persistenceID: persistenceID,
        placeholder: "没有匹配的数据",
        tooltips: true,
        variableHeight: true,
        columnDefaults: {
          resizable: true,
          minWidth: 88,
          headerTooltip: true
        }
      });

      table.on("dataLoaded", function(data) {
        document.getElementById("table-status").textContent =
          "已加载 " + data.length + " 条；文件共 {{recordsTotal}} 条";
      });

      table.on("dataLoadError", function(error) {
        document.getElementById("table-status").textContent = "加载失败：" + error.message;
      });

      function reconcileSearch() {
        var query = document.getElementById("search").value.trim().toLowerCase();
        if (!query) {
          table.clearFilter();
          return;
        }
        table.setFilter(function(row) {
          return rawColumns.some(function(name) {
            var value = row[name];
            if (value === null || value === undefined) {
              return false;
            }
            return String(value).toLowerCase().indexOf(query) !== -1;
          });
        });
      }

      document.getElementById("search").addEventListener("input", reconcileSearch);

      document.getElementById("key").addEventListener("change", function() {
        var key = this.value;
        var datalist = document.getElementById("key-values");
        datalist.innerHTML = "";
        if (!key) {
          return;
        }
        var extra = new URLSearchParams(extraParams.replace(/^&/, ""));
        extra.set("key", key);
        fetch("/api/tsv/key/{{path}}?" + extra.toString())
          .then(function(response) { return response.json(); })
          .then(function(values) {
            values.forEach(function(value) {
              var option = document.createElement("option");
              option.value = String(value);
              datalist.appendChild(option);
            });
          });
      });

      function reloadData() {
        table.setData(apiUrl()).then(function() {
          reconcileSearch();
        });
      }

      document.getElementById("load-length").addEventListener("change", reloadData);
      document.getElementById("apply-key-filter").addEventListener("click", function() {
        currentPageQuery.set("key", document.getElementById("key").value);
        currentPageQuery.set("value", document.getElementById("value").value);
        reloadData();
      });

      document.getElementById("reset-layout").addEventListener("click", function() {
        if (typeof table.clearPersistence === "function") {
          table.clearPersistence();
        }
        window.location.reload();
      });

      var copyButton = document.querySelector(".copy-path-button");
      copyButton.addEventListener("click", function() {
        var value = copyButton.getAttribute("data-copy-path");
        var label = copyButton.querySelector(".button-label");
        var originalTitle = copyButton.title;
        var done = function() {
          label.textContent = "已复制";
          copyButton.title = "已复制";
          window.setTimeout(function() {
            label.textContent = "复制路径";
            copyButton.title = originalTitle;
          }, 1400);
        };
        var fallback = function() {
          var textarea = document.createElement("textarea");
          textarea.value = value;
          textarea.style.cssText = "position:fixed;left:-9999px;top:0";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
          done();
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(value).then(done, fallback);
        } else {
          fallback();
        }
      });

      var picker = document.getElementById("column-picker");
      var pickerList = document.getElementById("column-picker-list");

      function renderColumnPicker() {
        pickerList.innerHTML = "";
        table.getColumns().forEach(function(column) {
          var definition = column.getDefinition();
          var label = document.createElement("label");
          var checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = column.isVisible();
          checkbox.addEventListener("change", function() {
            if (checkbox.checked) {
              column.show();
            } else {
              column.hide();
            }
          });
          label.appendChild(checkbox);
          label.appendChild(document.createTextNode(definition.title || definition.field));
          pickerList.appendChild(label);
        });
      }

      document.getElementById("column-picker-button").addEventListener("click", function(event) {
        event.stopPropagation();
        renderColumnPicker();
        picker.classList.toggle("open");
      });

      document.getElementById("column-picker-close").addEventListener("click", function() {
        picker.classList.remove("open");
      });

      document.addEventListener("click", function(event) {
        if (!picker.contains(event.target)) {
          picker.classList.remove("open");
        }
      });
    })();
    </script>
  </body>
</html>
