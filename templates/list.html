<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ path or "/" }}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.7.1/dist/css/tabulator.min.css">
    <style>
    :root {
      --page-gutter: 20px;
      --border: #d9dee4;
      --text: #24292f;
      --muted: #667085;
      --accent: #1a56a0;
    }

    html,
    body {
      max-width: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #f5f6f8;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
    }

    button,
    input {
      font: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px var(--page-gutter);
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(8px);
    }

    .breadcrumbs {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      min-width: 0;
      margin: 0;
      padding: 0;
      overflow-x: auto;
      overflow-y: hidden;
      list-style: none;
      white-space: nowrap;
      scrollbar-width: thin;
    }

    .breadcrumbs li {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      min-width: 0;
    }

    .breadcrumbs li + li::before {
      content: "/";
      margin: 0 7px;
      color: #a0a7b1;
    }

    .breadcrumbs a,
    .breadcrumbs .current {
      overflow: hidden;
      max-width: 220px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .breadcrumbs a {
      color: var(--accent);
      text-decoration: none;
    }

    .breadcrumbs a:hover {
      text-decoration: underline;
    }

    .breadcrumbs .current {
      color: #344054;
      font-weight: 600;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 5px;
      background: #f1f5f9;
      text-decoration: none;
    }

    .upload-form {
      flex: 0 0 auto;
      margin: 0;
    }

    .upload-zone {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px 5px 12px;
      background: #fafbfc;
      border: 1px dashed #b9c2cc;
      border-radius: 6px;
      transition: border-color 0.15s, background 0.15s;
    }

    .upload-zone.dragover {
      background: #edf5ff;
      border-color: var(--accent);
    }

    .upload-zone input[type="file"] {
      display: none;
    }

    .upload-label {
      max-width: 220px;
      overflow: hidden;
      color: #555f6d;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 5px 10px;
      color: var(--text);
      background: #fff;
      border: 1px solid #c8ced6;
      border-radius: 5px;
      box-sizing: border-box;
      cursor: pointer;
      text-decoration: none;
    }

    .button:hover {
      color: var(--accent);
      border-color: var(--accent);
      text-decoration: none;
    }

    .button.primary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .button.primary:hover {
      color: #fff;
      background: #14467f;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .content {
      padding: 14px var(--page-gutter) 24px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
      padding: 9px 12px;
      margin-bottom: 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 7px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .count {
      margin-right: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .filter-button.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .search {
      width: min(280px, 36vw);
      height: 32px;
      padding: 5px 9px;
      border: 1px solid #c8ced6;
      border-radius: 5px;
      box-sizing: border-box;
    }

    #file-table {
      width: 100%;
      min-height: 280px;
      border: 1px solid var(--border);
      border-radius: 7px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
    }

    .tabulator {
      background: #fff;
      border: 0;
      font-size: 13px;
    }

    .tabulator .tabulator-header {
      color: #344054;
      background: #f8f9fa;
      border-bottom: 1px solid #cfd5dc;
    }

    .tabulator .tabulator-header .tabulator-col,
    .tabulator .tabulator-header .tabulator-col.tabulator-frozen {
      background: #f8f9fa;
    }

    .tabulator .tabulator-row:hover {
      background: #f4f8ff;
    }

    .file-name {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 7px;
      color: var(--accent);
      text-decoration: none;
    }

    .file-name:hover {
      text-decoration: underline;
    }

    .file-visual {
      position: relative;
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      color: #64748b;
      background: #eef2f6;
      border-radius: 8px;
    }

    .file-visual svg {
      width: 19px;
      height: 19px;
    }

    .file-visual.dir {
      color: #c17a00;
      background: #fff2cc;
    }

    .file-visual.doc {
      color: #2563eb;
      background: #e8f0ff;
    }

    .file-visual.table {
      color: #0f766e;
      background: #e4f7f3;
    }

    .file-visual.code {
      color: #7c3aed;
      background: #f0e9ff;
    }

    .file-visual.image {
      color: #db2777;
      background: #fce7f3;
    }

    .file-visual.archive {
      color: #c2410c;
      background: #ffeadb;
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .row-actions a {
      color: #57606a;
      text-decoration: none;
    }

    .row-actions a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .muted {
      color: #788394;
    }

    @media (max-width: 767px) {
      :root {
        --page-gutter: 8px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 8px;
      }

      .breadcrumbs {
        width: 100%;
      }

      .breadcrumbs a,
      .breadcrumbs .current {
        max-width: 130px;
      }

      .upload-form {
        width: 100%;
      }

      .upload-zone {
        justify-content: space-between;
      }

      .upload-label {
        flex: 1 1 auto;
        max-width: none;
      }

      .content {
        padding-top: 8px;
      }

      .toolbar {
        align-items: stretch;
        padding: 8px;
      }

      .toolbar-left,
      .toolbar-right {
        width: 100%;
      }

      .search {
        width: 100%;
      }

      #file-table {
        min-height: 240px;
      }
    }
    </style>
  </head>
  <body>
    <header class="topbar">
      {{ breadcrumbs_html | safe }}

      <form class="upload-form" action="/upload/{{path}}" method="post" enctype="multipart/form-data" id="upload-form">
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="file-input" name="file">
          <label class="upload-label" for="file-input" id="upload-label">选择文件上传，或拖到这里</label>
          <button class="button primary" type="submit" id="upload-button" disabled>上传</button>
        </div>
      </form>
    </header>

    <main class="content">
      <section class="toolbar">
        <div class="toolbar-left">
          <span class="count" id="count">正在加载…</span>
          <button class="button filter-button active" type="button" data-type="">全部</button>
          <button class="button filter-button" type="button" data-type="dir">文件夹</button>
          <button class="button filter-button" type="button" data-type="file">文件</button>
        </div>
        <div class="toolbar-right">
          <button class="button copy-path-button" type="button" data-copy-path="{{ copy_path }}" title="{{ copy_path }}">复制路径</button>
          <input class="search" type="search" id="search" placeholder="搜索文件名…">
        </div>
      </section>

      <div id="file-table"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.7.1/dist/js/tabulator.min.js"></script>
    <script>
    (function() {
      "use strict";

      var currentPath = {{ path | tojson }};
      if (currentPath === ".") currentPath = "";
      if (currentPath.charAt(0) === "/") {
        currentPath = "/" + currentPath.replace(/^\/+/, "");
      }
      var breadcrumbs = document.querySelector(".breadcrumbs");
      window.requestAnimationFrame(function() {
        breadcrumbs.scrollLeft = breadcrumbs.scrollWidth;
      });
      var copyButton = document.querySelector(".copy-path-button");
      copyButton.addEventListener("click", function() {
        var value = copyButton.getAttribute("data-copy-path");
        var done = function() {
          copyButton.textContent = "已复制";
          window.setTimeout(function() { copyButton.textContent = "复制路径"; }, 1400);
        };
        var fallback = function() {
          var textarea = document.createElement("textarea");
          textarea.value = value;
          textarea.style.cssText = "position:fixed;left:-9999px;top:0";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
          done();
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(value).then(done, fallback);
        } else {
          fallback();
        }
      });
      var activeType = "";
      var loadedRows = [];

      function encodePath(path) {
        return path.split("/").map(function(part) {
          return encodeURIComponent(part);
        }).join("/");
      }

      function fileCategory(name, type) {
        if (type === "dir") return "dir";
        var extension = name.split(".").pop().toLowerCase();
        if (["md", "markdown"].indexOf(extension) !== -1) return "doc";
        if (["tsv", "csv", "xls", "xlsx", "json", "ndjson"].indexOf(extension) !== -1) return "table";
        if (["py", "js", "ts", "tsx", "jsx", "go", "rs", "java", "sh", "sql"].indexOf(extension) !== -1) return "code";
        if (["png", "jpg", "jpeg", "gif", "webp", "svg"].indexOf(extension) !== -1) return "image";
        if (["zip", "tar", "gz", "bz2", "xz", "7z", "rar"].indexOf(extension) !== -1) return "archive";
        return "file";
      }

      function fileVisual(row) {
        var visual = document.createElement("span");
        visual.className = "file-visual " + fileCategory(row.name, row.type);
        visual.setAttribute("aria-hidden", "true");
        if (row.type === "dir") {
          visual.innerHTML =
            '<svg viewBox="0 0 24 24" aria-hidden="true">' +
              '<path d="M3 7.2A2.2 2.2 0 0 1 5.2 5h4.1c.6 0 1.17.24 1.59.67l1.34 1.34c.42.43.99.67 1.59.67h5.98A2.2 2.2 0 0 1 22 9.88v7.92A2.2 2.2 0 0 1 19.8 20H5.2A2.2 2.2 0 0 1 3 17.8Z" fill="currentColor"/>' +
              '<path d="M3 9.2h19" stroke="#fff" stroke-opacity=".65" stroke-width="1.4"/>' +
            '</svg>';
        } else {
          visual.innerHTML =
            '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
              '<path d="M6.5 2.75h7l5 5V21.25h-12Z" fill="#fff" fill-opacity=".65" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>' +
              '<path d="M13.5 2.75v5h5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>' +
              '<path d="M9 12h7M9 15.5h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' +
            '</svg>';
        }
        return visual;
      }

      function nameFormatter(cell) {
        var row = cell.getRow().getData();
        var link = document.createElement("a");
        link.className = "file-name";
        link.href = row.url;
        link.title = row.name;
        var name = document.createElement("span");
        name.textContent = row.name;
        link.appendChild(fileVisual(row));
        link.appendChild(name);
        return link;
      }

      function sizeFormatter(cell) {
        var row = cell.getRow().getData();
        return row.type === "dir" ? "—" : row.human_size;
      }

      function timeFormatter(cell) {
        var row = cell.getRow().getData();
        var wrapper = document.createElement("span");
        wrapper.textContent = row.date_str;
        var detail = document.createElement("small");
        detail.className = "muted";
        detail.style.display = "block";
        detail.textContent = row.human_time;
        wrapper.appendChild(detail);
        return wrapper;
      }

      function actionsFormatter(cell) {
        var row = cell.getRow().getData();
        if (row.type !== "file") {
          return "";
        }
        var wrapper = document.createElement("span");
        wrapper.className = "row-actions";
        if (row.preview_url) {
          var preview = document.createElement("a");
          preview.href = row.preview_url;
          preview.textContent = "预览";
          wrapper.appendChild(preview);
        }
        var download = document.createElement("a");
        download.href = row.download_url;
        download.textContent = "下载";
        wrapper.appendChild(download);
        return wrapper;
      }

      var table = new Tabulator("#file-table", {
        maxHeight: "calc(100vh - 210px)",
        minHeight: 280,
        ajaxURL: "/api/list/" + encodePath(currentPath),
        ajaxResponse: function(_url, _params, response) {
          loadedRows = response.items || [];
          return loadedRows;
        },
        columns: [
          {
            title: "名称",
            field: "name",
            minWidth: 220,
            widthGrow: 4,
            frozen: true,
            formatter: nameFormatter,
            sorter: "string"
          },
          {
            title: "大小",
            field: "size",
            width: 120,
            hozAlign: "right",
            formatter: sizeFormatter,
            sorter: "number"
          },
          {
            title: "类型",
            field: "type",
            width: 90,
            visible: false
          },
          {
            title: "操作",
            field: "actions",
            width: 150,
            headerSort: false,
            formatter: actionsFormatter
          },
          {
            title: "修改时间",
            field: "time",
            width: 190,
            formatter: timeFormatter,
            sorter: "number"
          }
        ],
        initialSort: [{ column: "time", dir: "desc" }],
        layout: "fitDataStretch",
        pagination: true,
        paginationSize: 50,
        paginationSizeSelector: [25, 50, 100, true],
        locale: "zh-cn",
        langs: {
          "zh-cn": {
            data: {
              loading: "正在加载",
              error: "加载失败"
            },
            pagination: {
              page_size: "每页",
              page_title: "页码",
              first: "首页",
              first_title: "第一页",
              last: "尾页",
              last_title: "最后一页",
              prev: "上一页",
              prev_title: "上一页",
              next: "下一页",
              next_title: "下一页",
              all: "全部"
            }
          }
        },
        persistence: true,
        persistenceID: "fserver.list.v1",
        placeholder: "目录为空或没有匹配项",
        responsiveLayout: false,
        tooltips: true
      });

      function updateCount() {
        var visible = table.getRows("active").length;
        var count = document.getElementById("count");
        count.textContent = visible === loadedRows.length
          ? "共 " + loadedRows.length + " 项"
          : "显示 " + visible + " / " + loadedRows.length + " 项";
      }

      function applyFilters() {
        var query = document.getElementById("search").value.trim().toLowerCase();
        table.setFilter(function(row) {
          if (activeType && row.type !== activeType) {
            return false;
          }
          return !query || row.name.toLowerCase().indexOf(query) !== -1;
        });
      }

      table.on("dataLoaded", updateCount);
      table.on("dataFiltered", updateCount);
      table.on("renderComplete", updateCount);

      document.querySelectorAll(".filter-button").forEach(function(button) {
        button.addEventListener("click", function() {
          document.querySelectorAll(".filter-button").forEach(function(item) {
            item.classList.remove("active");
          });
          button.classList.add("active");
          activeType = button.dataset.type || "";
          applyFilters();
        });
      });

      document.getElementById("search").addEventListener("input", applyFilters);

      var fileInput = document.getElementById("file-input");
      var uploadButton = document.getElementById("upload-button");
      var uploadLabel = document.getElementById("upload-label");
      var uploadZone = document.getElementById("upload-zone");

      fileInput.addEventListener("change", function() {
        var hasFile = fileInput.files.length > 0;
        uploadLabel.textContent = hasFile ? fileInput.files[0].name : "选择文件上传，或拖到这里";
        uploadButton.disabled = !hasFile;
      });

      uploadZone.addEventListener("dragover", function(event) {
        event.preventDefault();
        uploadZone.classList.add("dragover");
      });

      uploadZone.addEventListener("dragleave", function() {
        uploadZone.classList.remove("dragover");
      });

      uploadZone.addEventListener("drop", function(event) {
        event.preventDefault();
        uploadZone.classList.remove("dragover");
        if (!event.dataTransfer.files.length) return;
        fileInput.files = event.dataTransfer.files;
        uploadLabel.textContent = event.dataTransfer.files[0].name;
        uploadButton.disabled = false;
      });
    })();
    </script>
  </body>
</html>
